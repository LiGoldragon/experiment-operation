[package]
name = "trial-ledger"
version = "0.3.0"
edition = "2024"
[features]
default = []
trace = ["operation-scope/trace"]
datom = ["dep:datom-codec", "operation-scope/datom", "dep:protos"]
[dependencies]
operation-scope = { path = "../scope-library" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "signal", "tracing"] }
rkyv = { version = "=0.8.18", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", features = ["rkyv"], optional = true }
[build-dependencies]
experiment-upgrade = { path = "../../upgrade" }

[dependencies.trial-lock]
path = "../lock"

[[bin]]
name = "trial-ledger-nexus"
path = "src/bin/nexus.rs"

[[bin]]
name = "trial-world"
path = "src/bin/world.rs"

[dependencies.protos]
git = "https://github.com/LiGoldragon/protos"
rev = "c93b598"
features = ["rkyv"]
optional = true

[dev-dependencies]
tempfile = "=3.27.0"

[dev-dependencies.tokio]
version = "=1.53.1"
features = ["process"]

[[bin]]
name = "trial-ledger-client"
path = "src/bin/client.rs"
required-features = ["datom"]

[[bin]]
name = "trial-ledger-meta"
path = "src/bin/meta.rs"
required-features = ["datom"]

[[bin]]
name = "trial-ledger-debug"
path = "src/bin/debug.rs"
required-features = ["datom"]
