[package]
name = "operation-ledger"
version = "0.2.0"
edition = "2024"

[features]
default = ["datom"]
datom = ["dep:experiment-upgrade", "dep:ethos-zero", "dep:sha2", "dep:protos", "dep:tempfile", "dep:datom-codec"]
trace = ["datom"]

[dependencies]
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "signal", "tracing"] }
kameo = "=0.22.2"
mio = { version = "=1.2.3", features = ["log"] }
redb = "=4.3.0"
rkyv = { version = "=0.8.18", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
anyhow = "=1.0.104"
experiment-upgrade = { path = "../upgrade" , optional = true }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", features = ["rkyv"] , optional = true }

tempfile = { version = "=3.27.0", optional = true }
sha2 = { version = "=0.10.9", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598", features = ["rkyv"] , optional = true }
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "1976e45fe1edfd5676cb33919dba1ec20c785a02" , optional = true }

[build-dependencies]
experiment-upgrade = { path = "../upgrade" }
anyhow = "=1.0.104"

sha2 = "=0.10.9"
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", features = ["rkyv"] }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598", features = ["rkyv"] }
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "1976e45fe1edfd5676cb33919dba1ec20c785a02" }

[dev-dependencies]
tempfile = "=3.27.0"

[[bin]]
name = "operation-ledger"
path = "src/main.rs"
required-features = ["datom"]

[[bin]]
name = "operation-debug"
path = "src/bin/debug.rs"
required-features = ["trace"]

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "manifest"
path = "src/bin/manifest.rs"
required-features = ["datom"]
